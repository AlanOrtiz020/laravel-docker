[www]
; Ajustado para EC2 t3.micro (1 GB de RAM compartida con MySQL).
; Cada proceso usa ~40-60 MB. Con más RAM se puede subir max_children.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
ping.path = /ping
clear_env = no
catch_workers_output = yes
